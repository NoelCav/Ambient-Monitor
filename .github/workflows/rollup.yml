name: rollup
# Manual only while the monitor isn't uploading. To run nightly again, add:
#   schedule:
#     - cron: '0 4 * * *'
on:
  workflow_dispatch:
jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
        working-directory: cloud/scripts
      - run: node rollup.js
        working-directory: cloud/scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
