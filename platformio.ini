[platformio]
default_envs = esp32s3
; Optional local overrides (gitignored), e.g. the OTA password. A glob, so a
; missing file is fine; see secrets.ini.example.
extra_configs = secrets*.ini

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Pinned explicitly: the data log lives on the "spiffs" partition, and a
; partition-table change would move/erase it. Don't change without reason.
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
; Writes src/build_info.h (the build time shown in status, the portal and mDNS).
extra_scripts = pre:scripts/build_info.py
lib_deps =
  adafruit/Adafruit BME280 Library@^2.1.2

; Over-the-air upload: `pio run -e ota -t upload`. Same firmware, flashed over
; WiFi to the mDNS name (device_id) instead of USB. ota_password comes from
; secrets.ini and must match OTA_PASSWORD (defaults to AP_PASSWORD) in secrets.h.
[env:ota]
extends = env:esp32s3
upload_protocol = espota
upload_port = esp32-ambient-01.local
upload_flags =
  --auth=${ota.password}

; Pins and runtime defaults live in src/config.h (single source of truth).
; WebServer, Preferences, LittleFS and ArduinoOTA are part of the core.

; Host unit tests for the pure logic in lib/ambient: `pio test -e native`.
; Uses PlatformIO's bundled MinGW toolchain (windows_x86).
[env:native]
platform = windows_x86
test_framework = unity
build_flags = -std=gnu++14
