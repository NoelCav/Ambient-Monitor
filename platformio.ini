[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit BME280 Library@^2.1.2
  mobizt/Firebase Arduino Client Library for ESP8266 and ESP32@^4.4.14

; Pins and runtime defaults live in src/config.h (single source of truth).
; WebServer + Preferences are part of the arduino-esp32 core — no extra deps.
